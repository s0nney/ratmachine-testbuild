services:
  ratmachine:
    build: .
    image: ratmachine
    command: amber watch
    stdin_open: true
    tty: true
    environment:
      DATABASE_URL: postgres://admin:password@db:5432/ratmachine_development
      RATMACHINE_MOD_USERNAME: wojak
      RATMACHINE_MOD_PASSWORD: tfwnogf
      # On by default in production; forced on here so development exercises it
      # too. Set to "false" to skip the ImageMagick call on every form render.
      RATMACHINE_CAPTCHA_ENABLED: "true"
    ports:
      - 3000:3000
    links:
      - db
    depends_on:
      - db
    volumes:
    - .:/app
    - shards:/app/lib

  db:
    image: postgres:18
    ports:
      - 5433:5432
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ratmachine_development
    volumes:
      - db:/var/lib/postgresql

volumes:
  db:
  shards:
